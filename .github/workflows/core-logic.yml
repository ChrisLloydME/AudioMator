name: Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  swift-test:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run core logic tests
        run: swift test

  xcode-test:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run app-hosted tests
        run: |
          xcodebuild \
            -project AudioMator.xcodeproj \
            -scheme AudioMator \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AudioMatorDerivedData" \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            test

      - name: Build and audit macOS 15 Release artifact
        run: |
          xcodebuild \
            -project AudioMator.xcodeproj \
            -scheme AudioMator \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AudioMatorDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
          scripts/validate-macos-artifact.sh \
            "$RUNNER_TEMP/AudioMatorDerivedData/Build/Products/Release/AudioMator.app" \
            15.0
